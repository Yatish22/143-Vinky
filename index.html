<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>For Vinky 🐾💘</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; background-color: #ff4d6d !important; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ff4d6d 0%, #d32f2f 50%, #c2185b 100%) !important;
      background-attachment: fixed; font-family: "Poppins", sans-serif; position: fixed; left: 0; top: 0;
    }
    
    .butterfly {
      position: absolute; width: 80px; height: 100px;
      z-index: 1; pointer-events: none;
      background: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExamU5djRkY3c4eW5kNnQ5NmRxZWY5NDlnMHRoaXZrY2IycnZjbnNucCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/ynQYWEbSPwaUo/giphy.gif') no-repeat center center;
      background-size: contain;
    }

    .trail-particle {
      position: absolute; pointer-events: none; z-index: 9999;
      animation: fadeOut 1s forwards;
    }
    @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.5) translateY(-20px); } }

    .card {
      width: min(88%, 380px); padding: 35px 20px; background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(10px); border-radius: 35px;
      text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.4); z-index: 10; border: 4px solid #ff8a80;
      max-height: 90vh; overflow-y: auto;
    }

    .dog-container { width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 4px solid #ff4d6d; background: #fdfdfd; }
    .dog-gif { width: 100%; height: 100%; object-fit: cover; }

    h2 { font-family: 'Dancing Script', cursive; font-size: 28px; color: #b71c1c; margin-bottom: 5px; }
    p { color: #333; font-size: 13px; line-height: 1.4; font-weight: 500; }

    .typing::after { content: '|'; animation: blink 0.7s infinite; color: #ff4d6d; font-weight: bold; }
    @keyframes blink { 50% { opacity: 0; } }

    #puzzleArea { margin-top: 10px; padding: 15px; background: #fff5f7; border-radius: 20px; border: 2px dashed #ff4d6d; }
    .jumbled { font-weight: 800; font-size: 22px; color: #ff4d6d; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; }
    input { width: 80%; padding: 10px; border-radius: 12px; border: 2px solid #ffccd5; text-align: center; font-size: 16px; outline: none; margin-bottom: 10px; }
    
    .btn-wrap { margin-top: 20px; min-height: 50px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    button { border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    #yes { background: #ff4d6d; color: white; width: 100px; height: 45px; }
    #no { background: #eeeeee; color: #888; width: 100px; height: 45px; position: relative; }
    .check-btn { background: #b71c1c; color: white; padding: 10px 25px; width: 100%; font-size: 14px; }

    #gift-btn { 
      background: #4caf50; color: white; padding: 12px 20px; font-size: 14px; 
      margin-top: 15px; display: none; text-decoration: none; border-radius: 25px;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); animation: pulse 2s infinite;
      cursor: pointer;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    .hidden { display: none !important; }
    .heart { position: absolute; bottom: -20px; animation: floatUp linear forwards; pointer-events: none; z-index: 1; }
    @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-110vh); opacity: 0; } }

    /* Stats Dashboard Styling */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-top: 15px; }
    .stat-card { background: #fff5f7; padding: 10px; border-radius: 12px; border: 1px solid #ffccd5; }
    .stat-label { color: #888; font-size: 10px; text-transform: uppercase; }
    .stat-value { color: #ff4d6d; font-weight: bold; font-size: 16px; display: block; }
  </style>
</head>
<body onmousemove="createTrail(event)" ontouchmove="createTrail(event)">

  <audio id="barkSound" preload="auto">
    <source src="https://files.catbox.moe/mbgbhz.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="mainCard">
    <div class="dog-container">
      <img id="dog-img" class="dog-gif" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnhkamFidGxkM3BzcHZvdWxlNzlvOTh2a2JuN3Z2aGJ6bGtkOHNpdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3LqUOqjUTp7bNzdEnG/giphy.gif">
    </div>

    <div id="welcomeContent">
        <h2 id="title">Hey Vinky...</h2>
        <p id="message">The puppy has something for you! 🐾 <br> Can you unlock it?</p>
        <div class="btn-wrap">
          <button id="yes" onmouseover="beHappy()" onclick="startPuzzle()">Ready! 💖</button>
          <button id="no" onmouseover="moveNo()" onclick="moveNo()">No 🙈</button>
        </div>
    </div>

    <div id="puzzleArea" class="hidden">
        <div class="jumbled" id="jumbledWord"></div>
        <span class="hint-text" style="font-size:11px; color:#888; font-style:italic;" id="hintBox"></span>
        <input type="text" id="userInput" placeholder="Your answer..." autocomplete="off">
        <button class="check-btn" onclick="checkAnswer()">Unlock 🐾</button>
    </div>

    <div id="rewardContent" class="hidden">
        <h2 id="rewardTitle"></h2>
        <p id="rewardMessage"></p>
        <div id="dynamicVisualArea"></div> <a id="gift-btn">🎁 Open Today's Gift</a>
        <p style="font-size: 12px; color: #ff4d6d; font-weight: bold; margin-top: 10px;">Vinky, you're the best! ❤️</p>
    </div>
  </div>

  <script>
    localStorage.clear(); 
    const TEST_DAY = 14; // SET TO 14 TO TEST THE FINALE

    const dogImg = document.getElementById('dog-img');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const bark = document.getElementById('barkSound');
    const giftBtn = document.getElementById('gift-btn');
    const visualArea = document.getElementById('dynamicVisualArea');
    
    const _v1 = "MDUyMDIx"; 
    const _c1 = "RTRDSCA5QzlHIEE0NTkgNzI5Mw=="; 

    const puzzles = {
      7:  { jum: "SERO", ans: "ROSE", h: "Hint: A classic red flower!" },
      8:  { jum: "PESOPOR", ans: "PROPOSE", h: "Hint: Asking a big question!" },
      9:  { jum: "COCOHTELA", ans: "CHOCOLATE", h: "Hint: Sweeter than sugar!" },
      10: { jum: "DETDY", ans: "TEDDY", h: "Hint: Soft and huggable!" },
      11: { jum: "SIMEPRO", ans: "PROMISE", h: "Hint: A word of honor!" },
      12: { jum: "GHU", ans: "HUG", h: "Hint: A warm squeeze!" },
      13: { jum: "SSIK", ans: "KISS", h: "Hint: A pucker on the cheek!" },
      14: { jum: "REVEFOR", ans: "FOREVER", h: "Hint: Our love story timeline." }
    };

    const dogData = {
      7: { t: "Rose Day 🌹", m: "Every rose reminds me of you, but no flower could ever capture your beauty.", i: "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2VqbjB3aW9uazI0ZXplM204bjVqZTdjaHIycTh3N3BmaWJoNG5vZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/BVDMmwqGUMA79u6MtR/giphy.gif" },
      8: { t: "Propose Day 💍", m: "Vinky, every moment with you feels like home. Will you be mine forever?", i: "https://c.tenor.com/wAmkPoYJ02IAAAAd/tenor.gif" },
      9: { t: "Chocolate Day 🍫", m: "You’re my favorite addiction—the kind I never want to recover from.", i: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcW9ybXM5dWkwZ2xkZnFhY2Fzcnl2aXJtZGtjenpveTRubWhtdmowYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/HB6CxPHZjMf9F2gi6K/giphy.gif", isSecret: true },
      10: { t: "Teddy Day 🧸", m: "I’m counting the seconds until I can be your personal teddy bear again.", i: "https://images.stockcake.com/public/7/e/5/7e58a64e-3be6-46ad-b6e4-9aaeb986de98_large/puppy-cuddling-toy-stockcake.jpg" },
      11: { t: "Promise Day 🤝", m: "Vinky, I promise to choose you when things are hard and when the world is loud.", i: "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHBicHpxZzZueXN6bm9oZzR4MzB6Z3ZueXN6bm9oZzR4MzB6Z3ZueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7Wn1wbeIE28s2eTMV6/giphy.gif" },
      12: { t: "Hug Day 🤗", m: "Consider this a virtual squeeze! I miss your warmth every single day.", i: "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTdtbHQ2ejFrbTMxcWl2OHd5YmYxMDliNXZlcHJ2dHRyaGExeGx2eSZlcD12MV9pbnRlcm5hbF9naGx2eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/hoh795TvO1ccqadUlk/giphy.gif" },
14: { 
          t: "Valentine's Day ❤️", 
          m: "Vinky, our little puppy got a bit too eager for the grand finale and ended up 'eating' the Kiss Day surprise yesterday! 🐶🙈 I’m so sorry I missed it, but honestly? No screen could ever capture the way I truly want to kiss you. You are the rhythm in my heartbeat and the quiet peace in my loudest days. Even with the miles between us, you are the first thing I think of when I wake up and the last prayer I whisper before I sleep. You aren't just my favorite person; you are my home, my anchor, and my greatest 'forever.' I promise to make up for yesterday with a lifetime of real kisses and a love that never fades. Happy Valentine’s Day, my beautiful soul! ❤️✨", 
          i: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs4bGpwem84M3Vlbm5ydG4zMWs0aTMxaDljOHJxcXY3NGZ0czBsbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eKmmfhyHPyTFDFCEYn/giphy.gif" 
      },    };

    function startPuzzle() {
        const date = TEST_DAY || new Date().getDate();
        document.getElementById('welcomeContent').classList.add('hidden');
        document.getElementById('puzzleArea').classList.remove('hidden');
        const p = puzzles[date] || puzzles[7];
        document.getElementById('jumbledWord').innerText = p.jum;
        document.getElementById('hintBox').innerText = p.h;
    }

    function checkAnswer() {
        const date = TEST_DAY || new Date().getDate();
        const input = document.getElementById('userInput').value.toUpperCase().trim();
        const p = puzzles[date] || puzzles[7];
        if (input === p.ans) {
            document.getElementById('puzzleArea').classList.add('hidden');
            renderReward(date);
            bark.play().catch(()=>{});
        } else {
            document.getElementById('userInput').style.borderColor = "#ff4d6d";
            document.getElementById('userInput').value = "";
        }
    }

    function renderReward(date) {
        document.getElementById('rewardContent').classList.remove('hidden');
        const data = dogData[date] || dogData[7];
        document.getElementById('rewardTitle').innerText = data.t;
        const msgEl = document.getElementById('rewardMessage');
        msgEl.innerHTML = ""; 
        msgEl.classList.add('typing');
        dogImg.src = data.i;
        
        let i = 0;
        function typeWriter() {
            if (i < data.m.length) {
                msgEl.innerHTML += data.m.charAt(i);
                i++;
                setTimeout(typeWriter, 40);
            } else {
                msgEl.classList.remove('typing');
                heartBurst(); 
            }
        }
        typeWriter(); 

        // DAY 11 LOGIC (PROMISE + BLINKIT HINT)
        if(date === 11) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = "🤝 Seal Our Promise";
            giftBtn.onclick = function() {
                visualArea.innerHTML = `
                    <div style="background: white; border: 2px solid #ff4d6d; padding: 15px; border-radius: 15px; margin-top: 15px;">
                        <h3 style="color: #ff4d6d; margin: 0; font-family: 'Dancing Script';">The Soul-Binding Pact 📜</h3>
                        <p style="font-size: 12px; font-style: italic;">"I promise to choose you, every single day."</p>
                    </div>
                    <div id="deliveryHint" style="margin-top: 15px; padding: 12px; background: #fff5f7; border-radius: 12px; border: 1px solid #ffccd5;">
                        <p style="font-size: 11px; color: #ff4d6d; margin: 0;">Keep your phone close, Vinky. A symbol of <b>∞</b> is coming to you right now via Blinkit! 🛵💨</p>
                    </div>`;
                giftBtn.style.display = "none";
            };
        } 
        // DAY 12: HUG DAY (Heartbeat)
        else if(date === 12) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = "🫂 Receive My Hug";
            giftBtn.onclick = function() {
                document.getElementById('mainCard').style.animation = "heartbeat 1.2s infinite";
                const style = document.createElement('style');
                style.innerHTML = `@keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }`;
                document.head.appendChild(style);
                msgEl.innerHTML = "<b>Status:</b> Wrapped in my arms. intensity: 100% ❤️";
                giftBtn.style.display = "none";
            };
        }
        // DAY 14: VALENTINE'S DAY (STATS FINALE)
        else if(date === 14) {
    giftBtn.style.display = "inline-block";
    giftBtn.innerText = "🔐 Access Your Gift Vault";
    giftBtn.href = "javascript:void(0)";
    giftBtn.removeAttribute('target'); 

    giftBtn.onclick = function() {
        const pass = prompt("🔒 IDENTITY VERIFICATION REQUIRED\n\nTo unlock your Valentine's Vault, enter the 4-digit code that marks the day the stars aligned to create my favorite person (DDMM).\n\nHint: It's the only date that truly matters to my heart.");
        
        // ⚠️ REPLACE '1205' with her actual birthdate (DDMM)
        if(pass === "1608") { 
            confetti({ 
                particleCount: 200, 
                spread: 100, 
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ffccd5', '#fff1f3', '#ffb3c1'] 
            });

            // STEP 1: CLEAR THE BACKGROUND EMOTIONAL MESSAGE
            msgEl.innerHTML = ""; 
            msgEl.classList.remove('typing');

            // STEP 2: SHOW THE "VALIDATED" MESSAGE + GIFT CARDS
            visualArea.innerHTML = `
                <div style="background: white; border-radius: 25px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #ffccd5; margin-top:10px; max-height: 450px; overflow-y: auto;">
                    
                    <h3 style="font-family: 'Dancing Script'; color: #ff4d6d; font-size: 26px; margin-bottom: 5px; text-align:center;">Validated! ✅</h3>
                    <p style="font-size: 12px; color: #666; margin-bottom: 20px; text-align:center; line-height:1.4;">
                        Access granted to the most special girl. <br>
                        <b>Your royal day starts here.</b>
                    </p>

                    <div style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
                        ${renderGiftCard("NYKAA 💄", "#fc2779", atob("MzI0NDIy"), atob("MjQzMjM="), "1000", "16 Dec 2026")}
                        ${renderGiftCard("WESTSIDE 👗", "#222222", "CODE-HERE", "PIN-HERE", "1000", "16 Dec 2026")}
                        ${renderGiftCard("MYNTRA 🛍️", "#ff3f6c", "CODE-HERE", "PIN-HERE", "1000", "16 Dec 2026")}
                        ${renderGiftCard("UBER 🚗", "#000000", "CODE-HERE", "PIN-HERE", "1000", "16 Dec 2026")}
                        ${renderGiftCard("B&B WORKS 🌸", "#005696", "CODE-HERE", "PIN-HERE", "1000", "16 Dec 2026")}
                        ${renderGiftCard("ZOMATO 🍕", "#cb202d", "CODE-HERE", "PIN-HERE", "1000", "16 Dec 2026")}
                        ${renderGiftCard("PVR CINEMAS 🍿", "#8a6d00", "CODE-HERE", "PIN-HERE", "1000", "16 Dec 2026")}
                    </div>

                    <p style="font-size: 10px; color: #aaa; margin-top: 20px; text-align: center; font-style: italic; border-top: 1px dashed #eee; padding-top:10px;">
                        "The world is your kingdom today, Princess."
                    </p>
                </div>
            `;
            
            // UPDATE BUTTON TO ROYAL GRADIENT
            giftBtn.innerText = "👑 For My Eternal Princess 👑";
            giftBtn.style.background = "linear-gradient(45deg, #ff4d6d, #ff8fa3)";
            giftBtn.style.boxShadow = "0 5px 15px rgba(255, 77, 109, 0.4)";
            
            giftBtn.onclick = function() {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                alert("✨ A Royal Decree from the Puppy Prince: ✨\n\n'Hear ye, hear ye! Princess Vinky, your carriage awaits for a day of absolute pampering. Every jewel, every gown, and every delight is yours to claim today. You are cherished beyond measure and loved more than any kingdom. Go spoil yourself, Your Highness!' 🐾👑💖");
            };
        } else if(pass !== null) {
            alert("The puppy is tilting his head in confusion... 🐶❓\n\nThat's not the day my favorite Princess was born. Try again, love! (DDMM)");
        }
    };
}

        // HELPER FUNCTION (Keep this outside of renderReward)
        function renderGiftCard(brand, color, code, pin, val, expiry) {
            return `
                <div style="border: 1.5px solid ${color}33; border-left: 6px solid ${color}; padding: 12px; border-radius: 12px; background: ${color}05;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="color: ${color}; font-weight: 800; font-size: 13px;">${brand}</span>
                        <span style="background: ${color}; color: white; padding: 2px 8px; border-radius: 8px; font-size: 9px; font-weight: bold;">₹${val}</span>
                    </div>
                    <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 5px;">
                        <div>
                            <small style="font-size: 8px; color: #999; text-transform: uppercase;">Code</small>
                            <div style="font-family: monospace; font-size: 12px; font-weight: bold; color: #333;">${code}</div>
                        </div>
                        <div>
                            <small style="font-size: 8px; color: #999; text-transform: uppercase;">PIN</small>
                            <div style="font-family: monospace; font-size: 12px; font-weight: bold; color: #333;">${pin}</div>
                        </div>
                    </div>
                    <div style="margin-top: 5px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 3px;">
                        <small style="font-size: 8px; color: #bbb;">Exp: ${expiry}</small>
                    </div>
                </div>
            `;
        }

        // HELPER FUNCTION TO DRAW CARDS (Add this outside renderReward or at the top of script)
        
    }

    function heartBurst() {
        const end = Date.now() + (1000);
        (function frame() {
          confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ffccd5'] });
          confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ffccd5'] });
          if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    function createTrail(e) {
        const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
        const y = e.pageY || (e.touches ? e.touches[0].pageY : 0);
        const p = document.createElement('div');
        p.className = 'trail-particle';
        p.innerHTML = '💖';
        p.style.left = x + 'px'; p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
    }

    function spawnButterfly() {
        const b = document.createElement('div');
        b.className = 'butterfly';
        b.style.top = Math.random() * window.innerHeight + 'px';
        b.style.left = '-60px';
        document.body.appendChild(b);
        b.animate([{ left: '-60px' }, { left: '110vw' }], { duration: 7000 }).onfinish = () => b.remove();
    }
    setInterval(spawnButterfly, 4000);

    function beHappy() { dogImg.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs4bGpwem84M3Vlbm5ydG4zMWs0aTMxaDljOHJxcXY3NGZ0czBsbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eKmmfhyHPyTFDFCEYn/giphy.gif"; }
    function moveNo() {
        noBtn.style.position = "fixed";
        noBtn.style.left = Math.random() * 70 + 10 + "vw";
        noBtn.style.top = Math.random() * 70 + 10 + "vh";
    }
    setInterval(() => {
      const heart = document.createElement("div"); heart.className = "heart"; heart.innerHTML = "🌸";
      heart.style.left = Math.random() * 98 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 800);
  </script>
</body>
</html>
