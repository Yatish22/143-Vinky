<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>For Vinky 🐾💘</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; background-color: #ff4d6d !important; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ff4d6d 0%, #d32f2f 50%, #c2185b 100%) !important;
      background-attachment: fixed; font-family: "Poppins", sans-serif; position: fixed; left: 0; top: 0;
    }
    
    .butterfly {
      position: absolute; width: 80px; height: 100px;
      z-index: 1; pointer-events: none;
      background: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExamU5djRkY3c4eW5kNnQ5NmRxZWY5NDlnMHRoaXZrY2IycnZjbnNucCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/ynQYWEbSPwaUo/giphy.gif') no-repeat center center;
      background-size: contain;
    }

    .trail-particle {
      position: absolute; pointer-events: none; z-index: 9999;
      animation: fadeOut 1s forwards;
    }
    @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.5) translateY(-20px); } }

    .card {
      width: min(88%, 380px); padding: 35px 20px; background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(10px); border-radius: 35px;
      text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.4); z-index: 10; border: 4px solid #ff8a80;
      max-height: 90vh; overflow-y: auto;
    }

    .dog-container { width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 4px solid #ff4d6d; background: #fdfdfd; }
    .dog-gif { width: 100%; height: 100%; object-fit: cover; }

    #carouselArea { 
      width: 100%; height: 200px; margin: 15px 0; border-radius: 20px; 
      overflow: hidden; border: 3px solid #ffccd5; position: relative; display: none;
    }
    .slide { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; opacity: 0; transition: opacity 1s ease-in-out; }
    .slide.active { opacity: 1; }

    .dots-container { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 5; }
    .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.5); border-radius: 50%; transition: 0.3s; }
    .dot.active { background: #ff4d6d; transform: scale(1.3); }

    h2 { font-family: 'Dancing Script', cursive; font-size: 28px; color: #b71c1c; margin-bottom: 5px; }
    p { color: #333; font-size: 13px; line-height: 1.4; font-weight: 500; }

    #puzzleArea { margin-top: 10px; padding: 15px; background: #fff5f7; border-radius: 20px; border: 2px dashed #ff4d6d; }
    .jumbled { font-weight: 800; font-size: 22px; color: #ff4d6d; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; }
    input { width: 80%; padding: 10px; border-radius: 12px; border: 2px solid #ffccd5; text-align: center; font-size: 16px; outline: none; margin-bottom: 10px; }
    
    .btn-wrap { margin-top: 20px; min-height: 50px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    button { border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    #yes { background: #ff4d6d; color: white; width: 100px; height: 45px; }
    #no { background: #eeeeee; color: #888; width: 100px; height: 45px; position: relative; }
    .check-btn { background: #b71c1c; color: white; padding: 10px 25px; width: 100%; font-size: 14px; }

    #gift-btn { 
      background: #4caf50; color: white; padding: 12px 20px; font-size: 14px; 
      margin-top: 15px; display: none; text-decoration: none; border-radius: 25px;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); animation: pulse 2s infinite;
      cursor: pointer;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    .hidden { display: none !important; }
    .heart { position: absolute; bottom: -20px; animation: floatUp linear forwards; pointer-events: none; z-index: 1; }
    @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-110vh); opacity: 0; } }
  </style>
</head>
<body onmousemove="createTrail(event)" ontouchmove="createTrail(event)">

  <audio id="barkSound" preload="auto">
    <source src="https://files.catbox.moe/mbgbhz.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="mainCard">
    <div class="dog-container">
      <img id="dog-img" class="dog-gif" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnhkamFidGxkM3BzcHZvdWxlNzlvOTh2a2JuN3Z2aGJ6bGtkOHNpdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3LqUOqjUTp7bNzdEnG/giphy.gif">
    </div>

    <div id="welcomeContent">
        <h2 id="title">Hey Vinky...</h2>
        <p id="message">The puppy has something for you! 🐾 <br> Can you unlock it?</p>
        <div class="btn-wrap">
          <button id="yes" onmouseover="beHappy()" onclick="startPuzzle()">Ready! 💖</button>
          <button id="no" onmouseover="moveNo()" onclick="moveNo()">No 🙈</button>
        </div>
    </div>

    <div id="puzzleArea" class="hidden">
        <div class="jumbled" id="jumbledWord"></div>
        <span class="hint-text" style="font-size:11px; color:#888; font-style:italic;" id="hintBox"></span>
        <input type="text" id="userInput" placeholder="Your answer..." autocomplete="off">
        <button class="check-btn" onclick="checkAnswer()">Unlock 🐾</button>
    </div>

    <div id="rewardContent" class="hidden">
        <h2 id="rewardTitle"></h2>
        <div id="carouselArea">
            <img src="photo1.jpg" class="slide active">
            <img src="photo2.jpg" class="slide">
            <img src="photo3.jpg" class="slide">
            <img src="photo4.jpg" class="slide">
            <div class="dots-container" id="dots"></div>
        </div>
        <p id="rewardMessage"></p>
        <a id="gift-btn" target="_blank">🎁 Open Today's Gift</a>
        <p style="font-size: 12px; color: #ff4d6d; font-weight: bold; margin-top: 10px;">Vinky, you're the best! ❤️</p>
    </div>
  </div>

  <script>
    localStorage.clear(); 
    const TEST_DAY = null; 

    const dogImg = document.getElementById('dog-img');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const bark = document.getElementById('barkSound');
    const giftBtn = document.getElementById('gift-btn');
    
    const _v1 = "MDUyMDIx"; 
    const _c1 = "RTRDSCA5QzlHIEE0NTkgNzI5Mw=="; 

    const puzzles = {
      7:  { jum: "SERO", ans: "ROSE", h: "Hint: A classic red flower!" },
      8:  { jum: "PESOPOR", ans: "PROPOSE", h: "Hint: Asking a big question!" },
      9:  { jum: "COCOHTELA", ans: "CHOCOLATE", h: "Hint: Sweeter than sugar!" },
      10: { jum: "DETDY", ans: "TEDDY", h: "Hint: Soft and huggable!" },
      11: { jum: "SIMEPRO", ans: "PROMISE", h: "Hint: A word of honor!" },
      12: { jum: "GHU", ans: "HUG", h: "Hint: A warm squeeze!" },
      13: { jum: "SSIK", ans: "KISS", h: "Hint: A pucker on the cheek!" },
      14: { jum: "REVEFOR", ans: "FOREVER", h: "Hint: Our love story timeline." }
    };

    const dogData = {
      7: { 
          t: "Rose Day 🌹", 
          m: "Every rose reminds me of you, but no flower could ever capture your beauty. This song is defined about you😜.", 
          i: "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2VqbjB3aW9uazI0ZXplM204bjVqZTdjaHIycTh3N3BmaWJoNG5vZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/BVDMmwqGUMA79u6MtR/giphy.gif", 
          giftLink: "https://music.youtube.com/watch?v=43qWwQtbRuk", 
          giftText: "🎵 Listen to this Music as per my Version about You" 
      },
      8: { 
          t: "Propose Day 💍", 
          m: "The puppy has a very important question: Will you be our Valentine forever? I'm already planning our next visit when we meet... ❤️", 
          i: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHBicHpxZzZueXN6bm9oZzR4MzB6Z3ZueXN6bm9oZzR4MzB6Z3ZueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26hpKSUWpMHBdzBTO/giphy.gif",
          giftLink: "https://maps.app.goo.gl/9R38hX8fT3Z7L4hE9", 
          giftText: "📍 Our Next Visit When We Meet" 
      },
      9: { 
          t: "Chocolate Day 🍫", 
          m: "I have a sweet surprise, but it's locked! 🔒", 
          i: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcW9ybXM5dWkwZ2xkZnFhY2Fzcnl2aXJtZGtjenpveTRubWhtdmowYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/HB6CxPHZjMf9F2gi6K/giphy.gif", 
          isSecret: true, 
          giftText: "🎁 Unlock Chocolate Gift" 
      },
      10: { t: "Teddy Day 🧸", m: "Sending you a warm cuddle!", i: "https://images.stockcake.com/public/7/e/5/7e58a64e-3be6-46ad-b6e4-9aaeb986de98_large/puppy-cuddling-toy-stockcake.jpg" },
      11: { t: "Promise Day 🤝", m: "I promise to always be yours.", i: "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDdtdmZuaHFmNDFpb3FqN3MyeGRnc3BnYjIwY2EybmxvbXBqaTgyNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7Wn1wbeIE28s2eTMV6/giphy.gif" },
      12: { t: "Hug Day 🤗", m: "Consider this a virtual squeeze!", i: "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTdtbHQ2ejFrbTMxcWl2OHd5YmYxMDliNXZlcHJ2dHRyaGExeGx2eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/hoh795TvO1ccqadUlk/giphy.gif" },
      13: { t: "Kiss Day 💋", m: "Mwah! Kisses from the puppy!", i: "https://media.tenor.com/C_1jbx4N3wEAAAAM/dog-lick.gif" },
      14: { t: "Valentine's Day ❤️", m: "Looking at these memories makes me love you more!", i: "", giftLink: "https://docs.google.com/forms/d/e/1FAIpQLSf...", giftText: "💝 Pick Your Present" }
    };

    function startPuzzle() {
        const today = new Date();
        const date = TEST_DAY || today.getDate();
        const month = today.getMonth(); 
        if (date < 7 && month <= 1) { 
            document.getElementById('title').innerText = "Vinky... 💖";
            document.getElementById('message').innerHTML = "Will you be my Valentine? <br> (The puppy is waiting for your answer!)";
            yesBtn.innerText = "YES! ✨";
            yesBtn.onclick = function() {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('title').innerText = "It's a Date! 🥰";
                document.getElementById('message').innerHTML = `You've made me the happiest! <br><br> <b>The daily puzzles start here on Feb 7th!</b>`;
                yesBtn.style.display = "none";
                noBtn.style.display = "none";
                dogImg.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs4bGpwem84M3Vlbm5ydG4zMWs0aTMxaDljOHJxcXY3NGZ0czBsbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eKmmfhyHPyTFDFCEYn/giphy.gif";
                bark.play().catch(()=>{});
            };
            return;
        }
        document.getElementById('welcomeContent').classList.add('hidden');
        document.getElementById('puzzleArea').classList.remove('hidden');
        const p = puzzles[date] || puzzles[7];
        document.getElementById('jumbledWord').innerText = p.jum;
        document.getElementById('hintBox').innerText = p.h;
    }

    function checkAnswer() {
        const date = TEST_DAY || new Date().getDate();
        const input = document.getElementById('userInput').value.toUpperCase().trim();
        const p = puzzles[date] || puzzles[7];
        if (input === p.ans) {
            document.getElementById('puzzleArea').classList.add('hidden');
            confetti({ particleCount: 200, spread: 90 });
            renderReward(date);
            bark.play().catch(()=>{});
        } else {
            document.getElementById('userInput').style.borderColor = "#ff4d6d";
            document.getElementById('userInput').placeholder = "Try again, love! ❤️";
            document.getElementById('userInput').value = "";
        }
    }

    function renderReward(date) {
        document.getElementById('rewardContent').classList.remove('hidden');
        const data = dogData[date] || dogData[7];
        document.getElementById('rewardTitle').innerText = data.t;
        document.getElementById('rewardMessage').innerText = data.m;
        
        if(data.giftLink || data.isSecret) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = data.giftText;
            
            if(data.isSecret) {
                giftBtn.href = "javascript:void(0)";
                giftBtn.onclick = function() {
                    const pass = prompt("Enter the secret Month & Year (MMYYYY):");
                    if(pass === atob(_v1)) {
                        const realCode = atob(_c1);
                        alert("UNLOCKED! 🍫");
                        document.getElementById('rewardMessage').innerHTML = "<b>Your Sweet Treat Code:</b> <br><span style='color:#ff4d6d; font-size: 20px;'>" + realCode + "</span>";
                    } else {
                        alert("Wrong password! Only Vinky knows this! ❤️");
                    }
                };
            } else {
                giftBtn.href = data.giftLink;
                giftBtn.onclick = null;
            }
        } else { giftBtn.style.display = "none"; }

        if (date === 14) {
            document.getElementById('carouselArea').style.display = "block";
            setupCarouselDots();
            startAutoCarousel();
            dogImg.src = "https://media.tenor.com/C_1jbx4N3wEAAAAM/dog-lick.gif";
        } else { dogImg.src = data.i; }
    }

    function setupCarouselDots() {
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');
        if(!dotsContainer) return;
        dotsContainer.innerHTML = '';
        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = i === 0 ? 'dot active' : 'dot';
            dotsContainer.appendChild(dot);
        });
    }

    function startAutoCarousel() {
        let current = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        setInterval(() => {
            if(slides.length === 0) return;
            slides[current].classList.remove('active');
            if(dots[current]) dots[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
            if(dots[current]) dots[current].classList.add('active');
        }, 3000);
    }

    function createTrail(e) {
        const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
        const y = e.pageY || (e.touches ? e.touches[0].pageY : 0);
        const p = document.createElement('div');
        p.className = 'trail-particle';
        p.innerHTML = Math.random() > 0.5 ? '✨' : '💖';
        p.style.left = x + 'px'; p.style.top = y + 'px';
        p.style.fontSize = Math.random() * 15 + 10 + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }

    function spawnButterfly() {
        const b = document.createElement('div');
        b.className = 'butterfly';
        b.style.top = Math.random() * window.innerHeight + 'px';
        b.style.left = '-60px';
        document.body.appendChild(b);
        b.animate([{ left: '-60px' }, { left: '110vw' }], { duration: 7000 }).onfinish = () => b.remove();
    }
    setInterval(spawnButterfly, 3000);

    function beHappy() { if(!document.getElementById('welcomeContent').classList.contains('hidden')) dogImg.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs4bGpwem84M3Vlbm5ydG4zMWs0aTMxaDljOHJxcXY3NGZ0czBsbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eKmmfhyHPyTFDFCEYn/giphy.gif"; }
    function moveNo() {
        noBtn.style.position = "fixed";
        noBtn.style.left = Math.random() * 70 + 10 + "vw";
        noBtn.style.top = Math.random() * 70 + 10 + "vh";
        dogImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExczd0NmVpbTc2eGZkNXJlajRyc2Y0eWduazA2ZWdnYm1ycDlsOTJpZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/AQ60Mqpz7sJLK4DiOW/giphy.gif";
    }
    setInterval(() => {
      const heart = document.createElement("div"); heart.className = "heart"; heart.innerHTML = "🌸";
      heart.style.left = Math.random() * 98 + "vw"; heart.style.animationDuration = "4s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 600);
  </script>
</body>
</html>
