<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>For Vinky 🐾💘</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; background-color: #ff4d6d !important; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #ff4d6d 0%, #d32f2f 50%, #c2185b 100%) !important;
      background-attachment: fixed; font-family: "Poppins", sans-serif; position: fixed; left: 0; top: 0;
    }
    
    .butterfly {
      position: absolute; width: 80px; height: 100px;
      z-index: 1; pointer-events: none;
      background: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExamU5djRkY3c4eW5kNnQ5NmRxZWY5NDlnMHRoaXZrY2IycnZjbnNucCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/ynQYWEbSPwaUo/giphy.gif') no-repeat center center;
      background-size: contain;
    }

    .trail-particle {
      position: absolute; pointer-events: none; z-index: 9999;
      animation: fadeOut 1s forwards;
    }
    @keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(1.5) translateY(-20px); } }

    .card {
      width: min(88%, 380px); padding: 35px 20px; background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(10px); border-radius: 35px;
      text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.4); z-index: 10; border: 4px solid #ff8a80;
      max-height: 90vh; overflow-y: auto;
    }

    .dog-container { width: 120px; height: 120px; margin: 0 auto 15px; border-radius: 50%; overflow: hidden; border: 4px solid #ff4d6d; background: #fdfdfd; }
    .dog-gif { width: 100%; height: 100%; object-fit: cover; }

    #carouselArea { 
      width: 100%; height: 200px; margin: 15px 0; border-radius: 20px; 
      overflow: hidden; border: 3px solid #ffccd5; position: relative; display: none;
    }
    .slide { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; opacity: 0; transition: opacity 1s ease-in-out; }
    .slide.active { opacity: 1; }

    .dots-container { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 8px; z-index: 5; }
    .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.5); border-radius: 50%; transition: 0.3s; }
    .dot.active { background: #ff4d6d; transform: scale(1.3); }

    h2 { font-family: 'Dancing Script', cursive; font-size: 28px; color: #b71c1c; margin-bottom: 5px; }
    p { color: #333; font-size: 13px; line-height: 1.4; font-weight: 500; }

    .typing::after { content: '|'; animation: blink 0.7s infinite; color: #ff4d6d; font-weight: bold; }
    @keyframes blink { 50% { opacity: 0; } }

    #puzzleArea { margin-top: 10px; padding: 15px; background: #fff5f7; border-radius: 20px; border: 2px dashed #ff4d6d; }
    .jumbled { font-weight: 800; font-size: 22px; color: #ff4d6d; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; }
    input { width: 80%; padding: 10px; border-radius: 12px; border: 2px solid #ffccd5; text-align: center; font-size: 16px; outline: none; margin-bottom: 10px; }
    
    .btn-wrap { margin-top: 20px; min-height: 50px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    button { border-radius: 50px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s ease; }
    #yes { background: #ff4d6d; color: white; width: 100px; height: 45px; }
    #no { background: #eeeeee; color: #888; width: 100px; height: 45px; position: relative; }
    .check-btn { background: #b71c1c; color: white; padding: 10px 25px; width: 100%; font-size: 14px; }

    #gift-btn { 
      background: #4caf50; color: white; padding: 12px 20px; font-size: 14px; 
      margin-top: 15px; display: none; text-decoration: none; border-radius: 25px;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); animation: pulse 2s infinite;
      cursor: pointer;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

    .hidden { display: none !important; }
    .heart { position: absolute; bottom: -20px; animation: floatUp linear forwards; pointer-events: none; z-index: 1; }
    @keyframes floatUp { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-110vh); opacity: 0; } }
  </style>
</head>
<body onmousemove="createTrail(event)" ontouchmove="createTrail(event)">

  <audio id="barkSound" preload="auto">
    <source src="https://files.catbox.moe/mbgbhz.mp3" type="audio/mpeg">
  </audio>

  <div class="card" id="mainCard">
    <div class="dog-container">
      <img id="dog-img" class="dog-gif" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExMnhkamFidGxkM3BzcHZvdWxlNzlvOTh2a2JuN3Z2aGJ6bGtkOHNpdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3LqUOqjUTp7bNzdEnG/giphy.gif">
    </div>

    <div id="welcomeContent">
        <h2 id="title">Hey Vinky...</h2>
        <p id="message">The puppy has something for you! 🐾 <br> Can you unlock it?</p>
        <div class="btn-wrap">
          <button id="yes" onmouseover="beHappy()" onclick="startPuzzle()">Ready! 💖</button>
          <button id="no" onmouseover="moveNo()" onclick="moveNo()">No 🙈</button>
        </div>
    </div>

    <div id="puzzleArea" class="hidden">
        <div class="jumbled" id="jumbledWord"></div>
        <span class="hint-text" style="font-size:11px; color:#888; font-style:italic;" id="hintBox"></span>
        <input type="text" id="userInput" placeholder="Your answer..." autocomplete="off">
        <button class="check-btn" onclick="checkAnswer()">Unlock 🐾</button>
    </div>

    <div id="rewardContent" class="hidden">
        <h2 id="rewardTitle"></h2>
        <div id="carouselArea">
            <img src="photo1.jpg" class="slide active">
            <img src="photo2.jpg" class="slide">
            <img src="photo3.jpg" class="slide">
            <img src="photo4.jpg" class="slide">
            <div class="dots-container" id="dots"></div>
        </div>
        <p id="rewardMessage"></p>
        <a id="gift-btn">🎁 Open Today's Gift</a>
        <p style="font-size: 12px; color: #ff4d6d; font-weight: bold; margin-top: 10px;">Vinky, you're the best! ❤️</p>
    </div>
  </div>

  <script>
    localStorage.clear(); 
    const TEST_DAY = null; // Change to 11 to test Promise Day

    const dogImg = document.getElementById('dog-img');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const bark = document.getElementById('barkSound');
    const giftBtn = document.getElementById('gift-btn');
    
    const _v1 = "MDUyMDIx"; 
    const _c1 = "RTRDSCA5QzlHIEE0NTkgNzI5Mw=="; 

    const puzzles = {
      7:  { jum: "SERO", ans: "ROSE", h: "Hint: A classic red flower!" },
      8:  { jum: "PESOPOR", ans: "PROPOSE", h: "Hint: Asking a big question!" },
      9:  { jum: "COCOHTELA", ans: "CHOCOLATE", h: "Hint: Sweeter than sugar!" },
      10: { jum: "DETDY", ans: "TEDDY", h: "Hint: Soft and huggable!" },
      11: { jum: "SIMEPRO", ans: "PROMISE", h: "Hint: A word of honor!" },
      12: { jum: "GHU", ans: "HUG", h: "Hint: A warm squeeze!" },
      13: { jum: "SSIK", ans: "KISS", h: "Hint: A pucker on the cheek!" },
      14: { jum: "REVEFOR", ans: "FOREVER", h: "Hint: Our love story timeline." }
    };

    const dogData = {
      7: { t: "Rose Day 🌹", m: "Every rose reminds me of you, but no flower could ever capture your beauty. This song is defined about you😜.", i: "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2VqbjB3aW9uazI0ZXplM204bjVqZTdjaHIycTh3N3BmaWJoNG5vZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/BVDMmwqGUMA79u6MtR/giphy.gif", giftLink: "https://music.youtube.com/watch?v=43qWwQtbRuk", giftText: "🎵 Listen to this Music" },
      8: { t: "Propose Day 💍", m: "Vinky, every moment with you feels like home. Will you be mine forever?", i: "https://c.tenor.com/wAmkPoYJ02IAAAAd/tenor.gif", giftLink: "https://maps.google.com", giftText: "📍 Our Next Visit" },
      9: { t: "Chocolate Day 🍫", m: "You’re my favorite addiction—the kind I never want to recover from. Unlock it, if you can handle the sweetness. 🍫🔥❤️", i: "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcW9ybXM5dWkwZ2xkZnFhY2Fzcnl2aXJtZGtjenpveTRubWhtdmowYyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/HB6CxPHZjMf9F2gi6K/giphy.gif", isSecret: true, giftLink: "https://smoor.in/collections/chocolates", giftText: "🎁 Unlock Chocolate Gift" },
      10: { t: "Teddy Day 🧸", m: "I’m counting the seconds until I can be your personal teddy bear again. You’re mine, and I’ve got you, always. 🧸🔥❤️", i: "https://images.stockcake.com/public/7/e/5/7e58a64e-3be6-46ad-b6e4-9aaeb986de98_large/puppy-cuddling-toy-stockcake.jpg" },
      11: { t: "Promise Day 🤝", m: "Vinky, I promise to choose you when things are hard, when the world is loud, and even when we’re miles apart. I promise to be the peace you come home to. My word is my honor. ❤️🤝🔥", i: "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHBicHpxZzZueXN6bm9oZzR4MzB6Z3ZueXN6bm9oZzR4MzB6Z3ZueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7Wn1wbeIE28s2eTMV6/giphy.gif" },
      12: { 
                t: "Hug Day 🤗", 
                m: "Vinky, if I were there, I wouldn't just give you a hug; I’d pull you in so tight you’d forget the rest of the world exists. I want to be your safe place, the arms you run to when you're tired, and the warmth you feel when it's cold. Until I can hold you for real, let this digital squeeze remind you that my heart is always wrapped around yours. ❤️🔥", 
                i: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZhcXF6am9ueXpueXN6bm9oZzR4MzB6Z3ZueXN6bm9oZzR4MzB6Z3ZueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/hoh795TvO1ccqadUlk/giphy.gif" 
          },      13: { t: "Kiss Day 💋", m: "Mwah! Kisses from the puppy!", i: "https://media.tenor.com/C_1jbx4N3wEAAAAM/dog-lick.gif" },
      14: { t: "Valentine's Day ❤️", m: "Looking at these memories makes me love you more!", i: "", giftLink: "https://docs.google.com/forms/", giftText: "💝 Pick Your Present" }
    };

    function startPuzzle() {
        const today = new Date();
        const date = TEST_DAY || today.getDate();
        const month = today.getMonth(); 
        if (date < 7 && month <= 1) { 
            document.getElementById('title').innerText = "Vinky... 💖";
            document.getElementById('message').innerHTML = "Will you be my Valentine?";
            yesBtn.innerText = "YES! ✨";
            yesBtn.onclick = function() {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                document.getElementById('title').innerText = "It's a Date! 🥰";
                document.getElementById('message').innerHTML = `The daily puzzles start here on Feb 7th!`;
                yesBtn.style.display = "none";
                noBtn.style.display = "none";
                dogImg.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs4bGpwem84M3Vlbm5ydG4zMWs0aTMxaDljOHJxcXY3NGZ0czBsbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eKmmfhyHPyTFDFCEYn/giphy.gif";
                bark.play().catch(()=>{});
            };
            return;
        }
        document.getElementById('welcomeContent').classList.add('hidden');
        document.getElementById('puzzleArea').classList.remove('hidden');
        const p = puzzles[date] || puzzles[7];
        document.getElementById('jumbledWord').innerText = p.jum;
        document.getElementById('hintBox').innerText = p.h;
    }

    function checkAnswer() {
        const date = TEST_DAY || new Date().getDate();
        const input = document.getElementById('userInput').value.toUpperCase().trim();
        const p = puzzles[date] || puzzles[7];
        if (input === p.ans) {
            document.getElementById('puzzleArea').classList.add('hidden');
            confetti({ particleCount: 200, spread: 90 });
            renderReward(date);
            bark.play().catch(()=>{});
        } else {
            document.getElementById('userInput').style.borderColor = "#ff4d6d";
            document.getElementById('userInput').placeholder = "Try again, love! ❤️";
            document.getElementById('userInput').value = "";
        }
    }

    function renderReward(date) {
        document.getElementById('rewardContent').classList.remove('hidden');
        const data = dogData[date] || dogData[7];
        document.getElementById('rewardTitle').innerText = data.t;
        const msgEl = document.getElementById('rewardMessage');
        msgEl.innerHTML = ""; 
        msgEl.classList.add('typing');
        
        let i = 0;
        function typeWriter() {
            if (i < data.m.length) {
                msgEl.innerHTML += data.m.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            } else {
                msgEl.classList.remove('typing');
                heartBurst(); 
            }
        }
        typeWriter(); 

        // DAY 10 LOGIC (TEDDY)
        if(date === 10) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = "🔐 Unlock My Secret for You";
            giftBtn.href = "javascript:void(0)";
            giftBtn.removeAttribute('target'); 
            giftBtn.onclick = function() {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff4d6d', '#ffccd5', '#ffffff'] });
                msgEl.innerHTML = `
                    <div id="polaroidFrame" style="background: white; padding: 10px 10px 35px 10px; border: 1px solid #ddd; border-radius: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transform: rotate(-2deg); margin-bottom: 20px;">
                        <div id="photoContainer" style="background: #222; height: 180px; width: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                             <img src="YOUR_PHOTO_URL_HERE" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                             <div id="blackLayer" style="position: absolute; top:0; left:0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.5s ease; color: white; z-index: 2;" onclick="this.style.opacity='0'; setTimeout(()=>this.remove(), 1500);">
                                <span style="font-size: 30px;">📸</span>
                                <span style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px;">Tap to Develop</span>
                             </div>
                        </div>
                        <p style="font-family: 'Dancing Script'; font-size: 20px; margin: 15px 0 0 0; color: #444; text-align: center;">Us > Distance ❤️</p>
                    </div>
                    <div id="ticketPass" style="background: #fff5f7; border: 2px dashed #ff4d6d; padding: 15px; border-radius: 15px; position: relative; opacity: 0; transform: translateY(20px); transition: all 1s ease 0.8s;">
                        <h3 style="color: #ff4d6d; margin: 0; font-family: 'Dancing Script'; font-size: 22px;">Official Cuddle Pass 🎟️</h3>
                        <p style="font-size: 11px; margin: 10px 0; color: #555;">Redeemable for infinite warm hugs the second we meet.</p>
                    </div>`;
                setTimeout(() => { document.getElementById('ticketPass').style.opacity = "1"; document.getElementById('ticketPass').style.transform = "translateY(0)"; }, 100);
                giftBtn.style.display = "none";
            };
        } 
        // DAY 11 LOGIC (PROMISE)
       // DAY 11 LOGIC (PROMISE + INFINITY GIFT)
        else if(date === 11) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = "🤝 Seal Our Promise";
            giftBtn.href = "javascript:void(0)";
            giftBtn.removeAttribute('target'); 
            giftBtn.onclick = function() {
                confetti({ 
                    particleCount: 150, 
                    spread: 70, 
                    origin: { y: 0.6 }, 
                    colors: ['#FFD700', '#ff4d6d', '#ffffff'] 
                });
                
                msgEl.innerHTML = `
                    <div id="pactCard" style="background: white; border: 2px solid #ff4d6d; padding: 20px; border-radius: 15px; margin-top: 15px; box-shadow: 0 10px 25px rgba(255,77,109,0.2); animation: pulse 2s infinite;">
                        <h3 style="color: #ff4d6d; margin: 0; font-family: 'Dancing Script'; font-size: 24px;">The Soul-Binding Pact 📜</h3>
                        <hr style="border: 0; border-top: 1px solid #ffebee; margin: 10px 0;">
                        <p style="font-size: 13px; font-style: italic; color: #333; line-height: 1.6;">
                            "I solemnly swear to cherish, protect, and choose Vinky above all others, from this day until the end of time."
                        </p>
                        <div style="font-size: 22px; margin-top: 10px;">🔒 ❤️ ✨</div>
                    </div>

                    <div id="deliveryHint" style="margin-top: 20px; padding: 15px; background: #fff5f7; border-radius: 12px; border: 1px solid #ffccd5; opacity: 0; transform: translateY(10px); transition: all 1s ease 1s;">
                        <p style="font-size: 12px; color: #b71c1c; margin: 0; font-weight: 600;">
                            ✨ A promise shouldn't just be heard... it should be worn.
                        </p>
                        <p style="font-size: 11px; color: #ff4d6d; margin-top: 5px;">
                            Keep your phone close, Vinky. A symbol of <b>∞</b> is making its way to you right now. 🛵💨
                        </p>
                        <p style="font-size: 10px; color: #888; margin-top: 5px;">Estimated Arrival: ~30 mins</p>
                    </div>
                `;

                // Animate the delivery hint sliding in after a short delay
                setTimeout(() => {
                    const hint = document.getElementById('deliveryHint');
                    if(hint) {
                        hint.style.opacity = "1";
                        hint.style.transform = "translateY(0)";
                    }
                }, 500);

                giftBtn.style.display = "none";
            };
        }
        // DAY 12: HUG DAY (Interactive Heartbeat Hug)
        else if(date === 12) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = "🫂 Receive My Hug";
            giftBtn.href = "javascript:void(0)";
            giftBtn.removeAttribute('target'); 

            giftBtn.onclick = function() {
                // Change the Dog Image to a hugging one
                dogImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZhcXF6am9ueXpueXN6bm9oZzR4MzB6Z3ZueXN6bm9oZzR4MzB6Z3ZueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/hoh795TvO1ccqadUlk/giphy.gif";
                
                // Card starts pulsing like a heartbeat
                const card = document.getElementById('mainCard');
                card.style.transition = "transform 0.6s ease-in-out";
                card.style.animation = "heartbeat 1.2s infinite";
                
                // Add the heartbeat keyframes dynamically
                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes heartbeat {
                        0% { transform: scale(1); }
                        25% { transform: scale(1.05); }
                        50% { transform: scale(1); }
                        75% { transform: scale(1.05); }
                        100% { transform: scale(1); }
                    }
                `;
                document.head.appendChild(style);

                confetti({
                    particleCount: 100, spread: 70, origin: { y: 0.6 },
                    colors: ['#ff4d6d', '#ffccd5', '#ffffff']
                });

                msgEl.innerHTML = `
                    <div style="background: #fff5f7; border: 2px solid #ff4d6d; padding: 20px; border-radius: 15px; margin-top: 15px; box-shadow: 0 10px 25px rgba(255,77,109,0.1);">
                        <h3 style="color: #ff4d6d; margin: 0; font-family: 'Dancing Script'; font-size: 24px;">Sending a Squeeze... 🫂</h3>
                        <p style="font-size: 13px; color: #333; margin-top: 10px; line-height: 1.6;">
                            <b>Current Status:</b> Wrapped in my arms.<br>
                            <b>Intensity:</b> 100% Tight & Warm.<br><br>
                            <i>I miss your smell, I miss your warmth, and I miss how perfectly you fit against me. Close your eyes... I'm right there.</i>
                        </p>
                        <p style="font-size: 14px; font-weight: bold; color: #b71c1c; margin-top: 10px;">I love you, Vinky! ❤️</p>
                    </div>
                `;
                giftBtn.style.display = "none";
            };
        }
        else if(data.giftLink || data.isSecret) {
            giftBtn.style.display = "inline-block";
            giftBtn.innerText = data.giftText;
            if(data.isSecret) {
                giftBtn.href = "javascript:void(0)";
                giftBtn.removeAttribute('target');
                giftBtn.onclick = function() {
                    const pass = prompt("Enter the secret Month & Year (MMYYYY):");
                    if(pass === atob(_v1)) {
                        alert("UNLOCKED! 🍫");
                        msgEl.innerHTML = `<b>Code:</b> <span style='color:#ff4d6d; font-size: 24px;'>${atob(_c1)}</span>`;
                        giftBtn.innerText = "🛒 Shop Now";
                        giftBtn.href = data.giftLink;
                        giftBtn.setAttribute('target', '_blank');
                        giftBtn.onclick = null;
                    } else { alert("Wrong password! ❤️"); }
                };
            } else {
                giftBtn.href = data.giftLink;
                giftBtn.setAttribute('target', '_blank');
                giftBtn.onclick = null;
            }
        } else { giftBtn.style.display = "none"; }

        if (date === 14) {
            document.getElementById('carouselArea').style.display = "block";
            setupCarouselDots();
            startAutoCarousel();
        } else { dogImg.src = data.i; }
    }

    function heartBurst() {
        const end = Date.now() + (2 * 1000);
        (function frame() {
          confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ffccd5'] });
          confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ffccd5'] });
          if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    function setupCarouselDots() {
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');
        if(!dotsContainer) return;
        dotsContainer.innerHTML = '';
        slides.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = i === 0 ? 'dot active' : 'dot';
            dotsContainer.appendChild(dot);
        });
    }

    function startAutoCarousel() {
        let current = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        setInterval(() => {
            if(slides.length === 0) return;
            slides[current].classList.remove('active');
            if(dots[current]) dots[current].classList.remove('active');
            current = (current + 1) % slides.length;
            slides[current].classList.add('active');
            if(dots[current]) dots[current].classList.add('active');
        }, 3000);
    }

    function createTrail(e) {
        const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
        const y = e.pageY || (e.touches ? e.touches[0].pageY : 0);
        const p = document.createElement('div');
        p.className = 'trail-particle';
        p.innerHTML = Math.random() > 0.5 ? '✨' : '💖';
        p.style.left = x + 'px'; p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }

    function spawnButterfly() {
        const b = document.createElement('div');
        b.className = 'butterfly';
        b.style.top = Math.random() * window.innerHeight + 'px';
        b.style.left = '-60px';
        document.body.appendChild(b);
        b.animate([{ left: '-60px' }, { left: '110vw' }], { duration: 7000 }).onfinish = () => b.remove();
    }
    setInterval(spawnButterfly, 3000);

    function beHappy() { if(!document.getElementById('welcomeContent').classList.contains('hidden')) dogImg.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWs4bGpwem84M3Vlbm5ydG4zMWs0aTMxaDljOHJxcXY3NGZ0czBsbSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eKmmfhyHPyTFDFCEYn/giphy.gif"; }
    function moveNo() {
        noBtn.style.position = "fixed";
        noBtn.style.left = Math.random() * 70 + 10 + "vw";
        noBtn.style.top = Math.random() * 70 + 10 + "vh";
        dogImg.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExczd0NmVpbTc2eGZkNXJlajRyc2Y0eWduazA2ZWdnYm1ycDlsOTJpZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/AQ60Mqpz7sJLK4DiOW/giphy.gif";
    }
    setInterval(() => {
      const heart = document.createElement("div"); heart.className = "heart"; heart.innerHTML = "🌸";
      heart.style.left = Math.random() * 98 + "vw";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }, 600);
  </script>
</body>
</html>
